# Publishes the package when a version tag (for example v3.0.0) is pushed. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the project version
        id: version
        run: |
          version=$(dotnet msbuild TotpAuthSharp/TotpAuthSharp.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $version in TotpAuthSharp.csproj."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Building packs the library too (GeneratePackageOnBuild), as a deterministic CI build with SourceLink,
      # and package validation checks the public API against the baseline version.
      - name: Build, test and pack
        run: dotnet test -c Release

      - name: Collect packages
        run: |
          mkdir artifacts
          cp "TotpAuthSharp/bin/Release/TotpAuthSharp.${{ steps.version.outputs.version }}.nupkg" \
             "TotpAuthSharp/bin/Release/TotpAuthSharp.${{ steps.version.outputs.version }}.snupkg" artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The NUGET_API_KEY repository secret is not set. See RELEASING.md."
            exit 1
          fi
          # The matching .snupkg symbols package is pushed automatically alongside the .nupkg.
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate --no-symbols

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag \
              --title "TotpAuthSharp ${{ steps.version.outputs.version }}" --generate-notes
          fi
